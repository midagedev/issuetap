name: credential-revoked
description: >
  401 starting at request 2 on /rest/. A correct client stops; a client
  that retries a dead credential burns the rate budget forever.
fixture: ../fixtures/tiny.yaml
dialect: cloud
locale: en
faults:
  - name: revoke
    after: 2
    status: 401
    pathPrefix: /rest/
assertions:
  - name: first myself works
    method: GET
    path: /rest/api/3/myself
    auth: true
    wantStatus: 200
  - name: second myself is 401
    method: GET
    path: /rest/api/3/myself
    auth: true
    wantStatus: 401
    wantContains: authenticated
